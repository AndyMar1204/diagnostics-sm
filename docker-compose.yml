services:
  db:
    image: mysql:8.0
    container_name: gstock-db
    environment:
      MYSQL_DATABASE: gstock_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: gstock_user
      MYSQL_PASSWORD: gstock_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gstock-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/gstock_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=gstock_user
      - SPRING_DATASOURCE_PASSWORD=gstock_password
      - JWT_SECRET=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      - JWT_EXPIRATION=86400000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
