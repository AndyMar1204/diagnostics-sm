spring.application.name=gStock-api

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/gstock_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gstock_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gstock_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
# Default expiration: 1 day (in milliseconds)
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
